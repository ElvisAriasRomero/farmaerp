# ============================================================
# FarmaERP — Blueprint de Render (Infrastructure as Code)
# Despliegue: API (Docker) + Redis + PostgreSQL + Frontend (static)  -> PLAN FREE
#
# Los WORKERS de Celery (worker y beat) están COMENTADOS porque requieren
# plan de pago en Render. Para activarlos cuando subas de plan, descomenta
# los bloques 'farmaerp-worker' y 'farmaerp-beat' más abajo.
#
# NOTA FREE: la base de datos PostgreSQL gratuita expira a los ~30 días y
# está limitada a 1 GB; el API se duerme tras 15 min de inactividad.
# ============================================================

databases:
  - name: farmaerp-db
    plan: free
    databaseName: db_prediccion
    user: farmaerp

services:
  # ---------------- Redis (broker/result de Celery) ----------------
  - type: redis
    name: farmaerp-redis
    plan: free
    ipAllowList: []   # solo accesible desde servicios internos de Render

  # ---------------- API Django (Docker) ----------------
  - type: web
    name: farmaerp-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/tienda/categorias/
    # En plan Free no se permite preDeployCommand: las migraciones se ejecutan
    # al iniciar el contenedor (ver CMD del Dockerfile).
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHONUNBUFFERED
        value: "1"
      # Orígenes del frontend permitidos por CORS y CSRF (ajusta tras desplegar)
      - key: CORS_ALLOWED_ORIGINS
        value: https://farmaerp-web.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://farmaerp-web.onrender.com
      # Base de datos (inyectada desde farmaerp-db)
      - key: DB_ENGINE
        value: django.db.backends.postgresql
      - key: DB_HOST
        fromDatabase:
          name: farmaerp-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: farmaerp-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: farmaerp-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: farmaerp-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: farmaerp-db
          property: password
      # Redis (Celery)
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: farmaerp-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: farmaerp-redis
          property: connectionString

  # ---------------- Frontend web (React + Vite, Static Site) ----------------
  - type: web
    name: farmaerp-web
    runtime: static
    buildCommand: "cd frontend && npm ci && npm run build"
    staticPublishPath: ./frontend/dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_API_URL
        value: https://farmaerp-api.onrender.com/api/v1
    routes:
      # SPA: cualquier ruta cae en index.html (React Router)
      - type: rewrite
        source: /*
        destination: /index.html

